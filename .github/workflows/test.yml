name: Coupled Modelling CI Pipeline

on:
  push:
    branches: [ main, dev, "feature/**" ]
  pull_request:
    branches: [ main, dev, "feature/**" ]

jobs:
  offline-tests:
    name: Fast Mock-Isolated Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r coupled_modelling/requirements.txt
          pip install -e .

      - name: Run offline test suite
        run: |
          PYTHONPATH=.:tests python -m unittest \
            tests/test_serialization.py \
            tests/test_explorer_api.py \
            tests/test_web_mutations.py \
            tests/test_deletion_sets.py \
            tests/test_openapi_spec.py \
            -v

  graphdb-integration-tests:
    name: GraphDB Integration Tests (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r coupled_modelling/requirements.txt
          pip install -e .

      - name: Start GraphDB Docker container
        run: |
          docker run -d --name graphdb -p 7200:7200 ontotext/graphdb:10.8.4

      - name: Wait for GraphDB server readiness
        run: |
          echo "Waiting for GraphDB REST API to become ready on http://localhost:7200..."
          for i in {1..60}; do
            if curl -fsS http://localhost:7200/rest/repositories >/dev/null 2>&1; then
              echo "GraphDB server is ready!"
              exit 0
            fi
            echo "GraphDB is starting (attempt $i)..."
            sleep 2
          done
          echo "GraphDB failed to start within timeout"
          exit 1

      - name: Create CI test repository
        run: |
          curl -fsS -X POST http://localhost:7200/rest/repositories \
            -F "config=@.github/graphdb/ci-repo-config.ttl"

      - name: Populate initial ontology schema and run integration tests
        env:
          GRAPHDB_URL: http://localhost:7200
          GRAPHDB_REPOSITORY: coupled-modelling-ci-test
          GRAPHDB_GRAPH: http://coupled_modelling.owl
        run: |
          PYTHONPATH=.:tests python backend/test.py
          PYTHONPATH=.:tests python -m unittest \
            tests/test_sparql_mutations.py \
            tests/test_sparql_creation.py \
            -v
